defaults:
  - ppo_trainer
  - _self_

# Default tasks configuration.
# Pre-seed with two empty entries so CLI overrides like tasks.0.* / tasks.1.* work without errors.
# Users can still append more tasks with +tasks.2.*, +tasks.3.*, etc.
tasks:
  - task_id: lora_small
    data:
      train_files: ./data/gsm8k/train.parquet
      val_files: ./data/gsm8k/test.parquet
      train_batch_size: 64
      max_prompt_length: 512
      max_response_length: 512
      filter_overlong_prompts: true
    actor_rollout_ref:
      rollout:
        agent:
          num_workers: 1
      model:
        lora_rank: 16
        lora_alpha: 32
        target_modules: all-linear
    trainer:
      experiment_name: multitask_lora_rank16_alpha32

  - task_id: lora_large
    data:
      train_files: ./data/gsm8k/train.parquet
      val_files: ./data/gsm8k/test.parquet
      train_batch_size: 64
      max_prompt_length: 512
      max_response_length: 512
      filter_overlong_prompts: true
    actor_rollout_ref:
      rollout:
        agent:
          num_workers: 1
      model:
        lora_rank: 32
        lora_alpha: 64
        target_modules: all-linear
    trainer:
      experiment_name: multitask_lora_rank32_alpha64
